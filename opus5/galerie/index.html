    </main>

    <dialog class="lightbox" data-lightbox aria-label="Bildansicht">
      <div class="lightbox__inner">
        <img data-lightbox-image alt="" decoding="async" />

        <div class="lightbox__bar">
          <p data-lightbox-caption></p>
          <div class="lightbox__nav">
            <span data-lightbox-counter aria-live="polite"></span>
            <button type="button" data-lightbox-prev>
              <span class="visually-hidden">Vorheriges Bild</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m15 5-7 7 7 7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button type="button" data-lightbox-next>
              <span class="visually-hidden">Nächstes Bild</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m9 5 7 7-7 7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button class="lightbox__close" type="button" data-lightbox-close>
              <span class="visually-hidden">Bildansicht schließen</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M6 6l12 12M18 6 6 18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </dialog>
